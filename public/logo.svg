<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Angular 'A'-shaped mark (two overlapping strokes forming a peak/arrow) -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B87A6" />
      <stop offset="100%" stop-color="#3F6883" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E24A6B" />
      <stop offset="100%" stop-color="#C13854" />
    </linearGradient>
  </defs>
  
  <!-- Left Stroke (representing the peak arrow) -->
  <path d="M 25 80 L 50 30 L 65 30 L 40 80 Z" fill="url(#blueGrad)" />
  
  <!-- Right Overlapping Stroke (forming the peak/arrow and crossing) -->
  <path d="M 45 80 L 60 50 L 75 50 L 60 80 Z" fill="url(#accentGrad)" opacity="0.85" />
  <path d="M 35 55 L 65 55 L 60 63 L 40 63 Z" fill="url(#blueGrad)" opacity="0.9" />
</svg>
